<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Station 6 · Buhu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400;1,500;1,600&family=Jost:wght@300;400;500&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="radar.css">
</head>
<body>

<header class="kopf">
  <div>
    <div class="kopf__marke">Waldmomente</div>
    <div class="kopf__station">Station 6 von 7</div>
  </div>
  <button class="kopf__ton" id="tonKnopf" aria-pressed="false">Ton aus</button>
</header>

<main class="huelle">

  <div class="radar-feld">
    <canvas id="radarCanvas"></canvas>
  </div>

  <div class="signal" id="signal" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span>
  </div>
  <p class="statuszeile" id="statuszeile">Radar ist aus</p>

  <div class="buhu-fortschritt" id="buhuFigur"></div>

  <button class="knopf knopf--gold" id="startKnopf">Radar einschalten</button>

  <p class="nachricht" id="nachricht" hidden></p>

  <figure class="szene" id="szene" hidden>
    <picture>
      <source srcset="img/buhu-6-truhe.webp" type="image/webp">
      <img src="img/buhu-6-truhe.jpg" alt="Eine Truhe mit drei leuchtenden Schlössern" loading="lazy">
    </picture>
  </figure>

  <section class="aufgabe" id="aufgabe" hidden>
    <h1 class="aufgabe__titel">Drei Töne öffnen die Kiste</h1>
    <p class="aufgabe__text">Hört zu und tippt die Töne in der richtigen Reihenfolge. Mitsummen hilft.</p>

    <div class="schloesser" id="schloesser"></div>

    <button class="knopf knopf--gold" id="vorspielKnopf">Töne anhören</button>

    <div class="klangtasten" id="klangtasten" hidden></div>

    <button class="knopf knopf--leise" id="nochmalKnopf" hidden>Noch mal vorspielen</button>
  </section>

  <p class="ruecksage" id="ruecksage"></p>

  <div class="abschluss" id="abschluss" hidden>
    <p class="abschluss__zeile"></p>
    <p class="abschluss__hinweis"></p>
    <p class="abschluss__weiter">Weiter mit dem nächsten QR Code.</p>
  </div>

</main>

<script src="radar.js"></script>
<script>
(function () {
  'use strict';

  var NACHRICHT =
    'Das vorletzte Stück liegt in einer verschlossenen Kiste.\n' +
    'Gespenster schließen nicht mit Schlüsseln ab. Wir schließen mit Tönen ab.\n' +
    'Hört gut zu. Mitsummen hilft.';

  /* Pentatonik, klingt immer freundlich */
  var TOENE = [
    { hz: 261.63, farbe: '#4A6B3A' },
    { hz: 293.66, farbe: '#7A9A5B' },
    { hz: 329.63, farbe: '#C9A227' },
    { hz: 392.00, farbe: '#B5651D' },
    { hz: 440.00, farbe: '#9FB8A0' }
  ];

  BUHU.aufbauen({ station: 6 });
  var el = function (id) { return document.getElementById(id); };

  var geheim = [];
  var getippt = [];
  var sperre = false;

  /* Drei Schloesser zeichnen */
  (function () {
    var s = el('schloesser');
    for (var i = 0; i < 3; i++) {
      var d = document.createElement('div');
      d.className = 'schloss';
      d.dataset.nr = i;
      d.innerHTML =
        '<svg viewBox="0 0 40 48">' +
          '<path class="buegel" d="M12 20v-6a8 8 0 0116 0v6" fill="none" stroke="#C8A96E" stroke-width="3.4" stroke-linecap="round"/>' +
          '<rect class="korpus" x="7" y="20" width="26" height="22" rx="4" fill="#2D4A35" stroke="#C8A96E" stroke-width="2"/>' +
          '<circle cx="20" cy="30" r="2.6" fill="#141a12"/>' +
        '</svg>';
      s.appendChild(d);
    }
  })();

  function neuesGeheimnis() {
    geheim = [];
    for (var i = 0; i < 3; i++) geheim.push(Math.floor(Math.random() * TOENE.length));
    getippt = [];
  }

  function tastenBauen() {
    var k = el('klangtasten');
    if (k.children.length) return;
    TOENE.forEach(function (t, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'klangtaste';
      b.style.background = t.farbe;
      b.setAttribute('aria-label', 'Ton ' + (i + 1));
      b.addEventListener('click', function () { tippen(i, b); });
      k.appendChild(b);
    });
  }

  function tonSpielen(i, verzug) {
    BuhuKlang.ton(TOENE[i].hz, 0.8, 'sine', 0.2, verzug || 0);
    BuhuKlang.ton(TOENE[i].hz * 2, 0.5, 'sine', 0.06, verzug || 0);
    setTimeout(function () {
      var t = el('klangtasten').children[i];
      if (t) {
        t.classList.add('leuchtet');
        setTimeout(function () { t.classList.remove('leuchtet'); }, 320);
      }
    }, (verzug || 0) * 1000);
  }

  function vorspielen() {
    sperre = true;
    getippt = [];
    BuhuKlang.wecken();
    el('vorspielKnopf').hidden = true;
    el('nochmalKnopf').hidden = true;
    BUHU.ruecksagen('');
    BUHU.sagen('Die Kiste singt');
    tastenBauen();
    el('klangtasten').hidden = false;

    var v = 0.4;
    geheim.forEach(function (i) { tonSpielen(i, v); v += 1.0; });

    setTimeout(function () {
      sperre = false;
      BUHU.sagen('Jetzt ihr');
      el('nochmalKnopf').hidden = false;
    }, (v + 0.5) * 1000);
  }

  function tippen(i, knopf) {
    if (sperre) return;
    tonSpielen(i, 0);
    getippt.push(i);
    var stelle = getippt.length - 1;

    if (getippt[stelle] !== geheim[stelle]) {
      sperre = true;
      BUHU.ruecksagen('Noch nicht. Hört noch mal.');
      BuhuKlang.ton(180, .45, 'sine', .12);
      /* alle Schloesser wieder zu */
      Array.prototype.forEach.call(el('schloesser').children, function (s) { s.classList.remove('offen'); });
      setTimeout(function () { sperre = false; vorspielen(); }, 1500);
      return;
    }

    /* richtig: Schloss springt auf */
    var schloss = el('schloesser').children[stelle];
    if (schloss) {
      schloss.classList.add('offen');
      BuhuKlang.ton(880, .3, 'sine', .15, .12);
    }

    if (getippt.length === geheim.length) {
      sperre = true;
      BUHU.ruecksagen('Die Kiste ist offen.');
      BUHU.sagen('Alle Schlösser offen');
      BuhuKlang.akkord();
      setTimeout(function () {
        el('aufgabe').hidden = true;
        BUHU.rissSchliessen();
      }, 1600);
    }
  }

  el('startKnopf').addEventListener('click', function () {
    el('startKnopf').hidden = true;
    BUHU.suchen(function () {
      el('nachricht').hidden = false;
      BUHU.nachricht(NACHRICHT, function () {
        BUHU.bildZeigen('szene', function () { el('aufgabe').hidden = false; });
      });
    });
  });

  el('vorspielKnopf').addEventListener('click', vorspielen);
  el('nochmalKnopf').addEventListener('click', function () {
    Array.prototype.forEach.call(el('schloesser').children, function (s) { s.classList.remove('offen'); });
    vorspielen();
  });

  neuesGeheimnis();

})();
</script>
</body>
</html>
