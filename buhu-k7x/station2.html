<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Station 2 · Buhu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400;1,500;1,600&family=Jost:wght@300;400;500&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="radar.css">
</head>
<body>

<header class="kopf">
  <div>
    <div class="kopf__marke">Waldmomente</div>
    <div class="kopf__station">Station 2 von 7</div>
  </div>
  <button class="kopf__ton" id="tonKnopf" aria-pressed="false">Ton aus</button>
</header>

<main class="huelle">

  <div class="radar-feld">
    <canvas id="radarCanvas"></canvas>
  </div>

  <div class="signal" id="signal" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span>
  </div>
  <p class="statuszeile" id="statuszeile">Radar ist aus</p>

  <div class="buhu-fortschritt" id="buhuFigur"></div>

  <button class="knopf knopf--gold" id="startKnopf">Radar einschalten</button>

  <p class="nachricht" id="nachricht" hidden></p>

  <figure class="szene" id="szene" hidden>
    <picture>
      <source srcset="img/buhu-2-lauschen.webp" type="image/webp">
      <img src="img/buhu-2-lauschen.jpg" alt="Buhu lauscht in den Wald" loading="lazy">
    </picture>
  </figure>

  <section class="aufgabe" id="aufgabe" hidden>
    <h1 class="aufgabe__titel">Hört genau hin</h1>
    <p class="aufgabe__text" id="aufgabeText">Gleich kommen die Geräusche. Merkt euch die Reihenfolge.</p>

    <button class="knopf knopf--gold" id="hoerenKnopf">Geräusche abspielen</button>

    <div class="kartenreihe" id="karten" hidden></div>

    <button class="knopf knopf--leise" id="nochmalKnopf" hidden>Noch mal hören</button>
  </section>

  <p class="ruecksage" id="ruecksage"></p>


  <div class="abschluss" id="abschluss" hidden>
    <p class="abschluss__zeile"></p>
    <p class="abschluss__hinweis"></p>
    <p class="abschluss__weiter">Weiter mit dem nächsten QR Code.</p>
  </div>

</main>

<script src="radar.js"></script>
<script>
(function () {
  'use strict';

  var NACHRICHT =
    'Kurz bevor der Sturm kam, habe ich vier Geräusche gehört. Ich weiß nur die Reih_nfolge nicht mehr.\n' +
    'Hört genau hin. Wenn ihr sie in der richtigen Reihenfolge findet, weiß ich wieder, wo ich gew_sen bin.';

  BUHU.aufbauen({ station: 2 });

  /* Echte Aufnahmen aus dem Waldmomente Klangarchiv, kurz geschnitten.
     Zusammen nur rund 50 KB, damit sie auch bei schwachem Empfang da sind. */
  /* Echte Aufnahmen aus dem Waldmomente Klangarchiv, kurz geschnitten.
     Die Karten sind gezeichnet und bringen Rahmen und Beschriftung mit. */
  var ALLE = {
    laub:    { name: 'Laub',    datei: 'klang/laub.mp3',    karte: 'img/karte-laub.png' },
    voegel:  { name: 'Vögel',   datei: 'klang/voegel.mp3',  karte: 'img/karte-voegel.png' },
    tropfen: { name: 'Tropfen', datei: 'klang/tropfen.mp3', karte: 'img/karte-tropfen.png' },
    wind:    { name: 'Wind',    datei: 'klang/wind.mp3',    karte: 'img/karte-wind.png' }
  };

  /* Jeder Klang einmal laden, danach ist er sofort da */
  var speicher = {};
  Object.keys(ALLE).forEach(function (k) {
    var a = new Audio(ALLE[k].datei);
    a.preload = 'auto';
    speicher[k] = a;
  });

  function klangSpielen(name, verzug) {
    setTimeout(function () {
      if (!BuhuKlang.an) return;
      var a = speicher[name];
      if (!a) return;
      try { a.currentTime = 0; a.volume = 0.9; a.play(); } catch (e) {}
    }, (verzug || 0) * 1000);
  }

  var folge = [];
  var getippt = [];
  var sperre = false;

  var startKnopf    = document.getElementById('startKnopf');
  var hoerenKnopf   = document.getElementById('hoerenKnopf');
  var nochmalKnopf  = document.getElementById('nochmalKnopf');
  var kartenFeld    = document.getElementById('karten');
  var aufgabe       = document.getElementById('aufgabe');

  startKnopf.addEventListener('click', function () {
    startKnopf.hidden = true;
    BUHU.suchen(function () {
      document.getElementById('nachricht').hidden = false;
      BUHU.nachricht(NACHRICHT, function () {
        BUHU.bildZeigen('szene', function () { aufgabe.hidden = false; });
      });
    });
  });

  function neueRunde(anzahl) {
    var namen = Object.keys(ALLE);
    folge = BUHU.mischen(namen).slice(0, anzahl);
    getippt = [];
    kartenFeld.hidden = true;
    nochmalKnopf.hidden = true;
    BUHU.ruecksagen('');
    hoerenKnopf.hidden = false;
    hoerenKnopf.textContent = 'Geräusche abspielen';
  }

  function abspielen() {
    sperre = true;
    hoerenKnopf.hidden = true;
    nochmalKnopf.hidden = true;
    kartenFeld.hidden = true;
    BuhuKlang.wecken();
    BUHU.sagen('Hört zu');
    var v = 0.4;
    folge.forEach(function (n, i) {
      setTimeout(function () { BUHU.sagen('Geräusch ' + (i + 1)); }, v * 1000);
      klangSpielen(n, v);
      v += 2.4;
    });
    setTimeout(function () {
      sperre = false;
      BUHU.sagen('Jetzt ihr');
      kartenZeigen();
    }, v * 1000);
  }

  function kartenZeigen() {
    kartenFeld.innerHTML = '';
    var reihenfolge = BUHU.mischen(folge);
    reihenfolge.forEach(function (n) {
      var k = document.createElement('button');
      k.className = 'karte';
      k.type = 'button';
      k.dataset.klang = n;
      k.innerHTML = '<img class="karte__bild" src="' + ALLE[n].karte + '" alt="' + ALLE[n].name + '">' +
        '<span class="karte__nr"></span>';
      k.addEventListener('click', function () { tippen(k, n); });
      kartenFeld.appendChild(k);
    });
    kartenFeld.hidden = false;
    nochmalKnopf.hidden = false;
  }

  function tippen(karte, name) {
    if (sperre || karte.classList.contains('gewaehlt')) return;
    getippt.push(name);
    karte.classList.add('gewaehlt');
    karte.querySelector('.karte__nr').textContent = getippt.length;
    klangSpielen(name, 0);

    var stelle = getippt.length - 1;
    if (getippt[stelle] !== folge[stelle]) {
      sperre = true;
      BUHU.ruecksagen('Fast. Hört noch mal hin.');
      BuhuKlang.ton(220, .4, 'sine', .12);
      setTimeout(function () {
        sperre = false;
        getippt = [];
        Array.prototype.forEach.call(kartenFeld.children, function (k) {
          k.classList.remove('gewaehlt');
          k.querySelector('.karte__nr').textContent = '';
        });
        abspielen();
      }, 1500);
      return;
    }

    if (getippt.length === folge.length) {
      sperre = true;
      BUHU.ruecksagen('Genau so war es.');
      BUHU.sagen('Reihenfolge stimmt');
      BuhuKlang.fundton();
      setTimeout(function () {
        aufgabe.hidden = true;
        BUHU.rissSchliessen();
      }, 1100);
    }
  }

  hoerenKnopf.addEventListener('click', abspielen);
  nochmalKnopf.addEventListener('click', function () {
    getippt = [];
    Array.prototype.forEach.call(kartenFeld.children, function (k) {
      k.classList.remove('gewaehlt');
      k.querySelector('.karte__nr').textContent = '';
    });
    abspielen();
  });

  neueRunde(4);

})();
</script>
<script>
/* Macht die Tour offline lauffaehig. Siehe sw.js */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
</script>
</body>
</html>
