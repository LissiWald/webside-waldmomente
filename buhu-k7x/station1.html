<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Station 1 · Buhu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400;1,500;1,600&family=Jost:wght@300;400;500&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="radar.css">
</head>
<body>

<header class="kopf">
  <div>
    <div class="kopf__marke">Waldmomente</div>
    <div class="kopf__station">Station 1 von 7</div>
  </div>
  <button class="kopf__ton" id="tonKnopf" aria-pressed="false">Ton aus</button>
</header>

<main class="huelle">

  <div class="radar-feld nebel-feld">
    <canvas id="radarCanvas"></canvas>
    <canvas id="nebelCanvas"></canvas>
  </div>

  <div class="signal" id="signal" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span>
  </div>
  <p class="statuszeile" id="statuszeile">Radar ist aus</p>

  <div class="buhu-fortschritt" id="buhuFigur"></div>

  <button class="knopf knopf--gold" id="startKnopf">Radar einschalten</button>

  <p class="nachricht" id="nachricht" hidden></p>

  <figure class="szene" id="szene" hidden>
    <picture>
      <source srcset="img/buhu-1-angst.webp" type="image/webp">
      <img src="img/buhu-1-angst.jpg" alt="Buhu versteckt sich hinter einem Baum im Nebel" loading="lazy">
    </picture>
  </figure>

  <section class="aufgabe" id="aufgabe" hidden>
    <h1 class="aufgabe__titel">Wischt den Nebel weg</h1>
    <p class="aufgabe__text">Fahrt mit dem Finger über das Radar. Wo ihr wischt, wird es klar.</p>
  </section>

  <p class="ruecksage" id="ruecksage"></p>

  <button class="knopf knopf--gold" id="helfenKnopf" hidden>Wir helfen dir</button>

  <div class="abschluss" id="abschluss" hidden>
    <p class="abschluss__zeile"></p>
    <p class="abschluss__hinweis"></p>
    <p class="abschluss__weiter">Weiter mit dem nächsten QR Code.</p>
  </div>

</main>

<script src="radar.js"></script>
<script>
(function () {
  'use strict';

  var NACHRICHT =
    'H_lfe! Endl_ch findet mich jemand.\n' +
    'Ich bin Buhu, das kleine Waldg_spenst. Letzte Nacht kam der Sturm. Er hat mich gegen einen Ast gew_rbelt, und mein Laken ist an sieben St_llen gerissen.\n' +
    'Ohne meine Flicken bin ich fast nur noch N_bel.\n' +
    'Helft ihr mir?';

  BUHU.aufbauen({ station: 1 });

  var startKnopf  = document.getElementById('startKnopf');
  var helfenKnopf = document.getElementById('helfenKnopf');
  var nebelFeld   = document.getElementById('nebelCanvas');
  var nachrichtEl = document.getElementById('nachricht');

  /* ── Nebelschicht ── */
  var nebel = {
    ctx: null, gr: 0, geputzt: 0, gesamt: 0, aktiv: false, fertig: false, ersterStrich: true,

    aufbauen: function () {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var b = nebelFeld.getBoundingClientRect();
      this.gr = Math.max(b.width, 240);
      nebelFeld.width = this.gr * dpr;
      nebelFeld.height = this.gr * dpr;
      this.ctx = nebelFeld.getContext('2d');
      this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      this.malen();
      /* Raster zum Zaehlen. Nur Felder innerhalb des Kreises zaehlen mit,
         sonst waeren die Ecken nie wegzuwischen und 70 Prozent unerreichbar. */
      this.felder = 14;
      this.raster = new Array(this.felder * this.felder).fill(0);
      var zelle = this.gr / this.felder, mitte = this.gr / 2, radius = this.gr / 2;
      this.imKreis = new Array(this.felder * this.felder).fill(0);
      this.gesamt = 0;
      for (var j = 0; j < this.felder; j++) {
        for (var i = 0; i < this.felder; i++) {
          var cx = (i + .5) * zelle, cy = (j + .5) * zelle;
          if (Math.hypot(cx - mitte, cy - mitte) <= radius * 0.95) {
            this.imKreis[j * this.felder + i] = 1;
            this.gesamt++;
          }
        }
      }
      this.geputzt = 0;
    },

    malen: function () {
      var g = this.ctx, s = this.gr;
      g.globalCompositeOperation = 'source-over';
      var v = g.createRadialGradient(s / 2, s / 2, s * 0.1, s / 2, s / 2, s / 2);
      v.addColorStop(0, 'rgba(224,228,220,.97)');
      v.addColorStop(1, 'rgba(188,196,186,.99)');
      g.fillStyle = v;
      g.fillRect(0, 0, s, s);
      /* Nebelschlieren */
      for (var i = 0; i < 70; i++) {
        var x = Math.random() * s, y = Math.random() * s, r = 14 + Math.random() * 42;
        var w = g.createRadialGradient(x, y, 0, x, y, r);
        w.addColorStop(0, 'rgba(255,255,255,.5)');
        w.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = w;
        g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
      }
    },

    wischen: function (x, y) {
      if (this.fertig) return;
      var g = this.ctx;
      g.globalCompositeOperation = 'destination-out';
      var r = this.gr * 0.14;
      var v = g.createRadialGradient(x, y, 0, x, y, r);
      v.addColorStop(0, 'rgba(0,0,0,1)');
      v.addColorStop(.65, 'rgba(0,0,0,.85)');
      v.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = v;
      g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();

      if (this.ersterStrich) {
        this.ersterStrich = false;
        BUHU.sagen('Da sind Augen');
        BuhuKlang.ton(640, .3, 'sine', .12);
      }

      /* Rasterfelder als geputzt vermerken */
      var f = this.felder, zelle = this.gr / f;
      var minI = Math.max(0, Math.floor((x - r) / zelle));
      var maxI = Math.min(f - 1, Math.floor((x + r) / zelle));
      var minJ = Math.max(0, Math.floor((y - r) / zelle));
      var maxJ = Math.min(f - 1, Math.floor((y + r) / zelle));
      for (var i = minI; i <= maxI; i++) {
        for (var j = minJ; j <= maxJ; j++) {
          var idx = j * f + i;
          if (this.raster[idx] || !this.imKreis[idx]) continue;
          var cx = (i + .5) * zelle, cy = (j + .5) * zelle;
          if (Math.hypot(cx - x, cy - y) <= r * .8) {
            this.raster[idx] = 1;
            this.geputzt++;
          }
        }
      }
      if (this.geputzt / this.gesamt >= 0.70) this.verwehen();
    },

    verwehen: function () {
      if (this.fertig) return;
      this.fertig = true;
      this.aktiv = false;
      BUHU.sagen('Der Nebel zieht ab');
      BuhuKlang.windstoss();
      nebelFeld.style.transition = 'opacity 1.6s ease';
      nebelFeld.style.opacity = '0';
      setTimeout(function () {
        nebelFeld.style.display = 'none';
        nachrichtZeigen();
      }, BUHU.ruhig ? 100 : 1700);
    }
  };

  function punkt(ev) {
    var b = nebelFeld.getBoundingClientRect();
    var t = ev.touches ? ev.touches[0] : ev;
    return { x: t.clientX - b.left, y: t.clientY - b.top };
  }
  function beginnen(ev) { if (!nebel.fertig) { nebel.aktiv = true; ziehen(ev); } }
  function ziehen(ev) {
    if (!nebel.aktiv || nebel.fertig) return;
    ev.preventDefault();
    var p = punkt(ev);
    nebel.wischen(p.x, p.y);
  }
  function enden() { nebel.aktiv = false; }

  nebelFeld.addEventListener('touchstart', beginnen, { passive: true });
  nebelFeld.addEventListener('touchmove', ziehen, { passive: false });
  nebelFeld.addEventListener('touchend', enden);
  nebelFeld.addEventListener('mousedown', beginnen);
  nebelFeld.addEventListener('mousemove', ziehen);
  window.addEventListener('mouseup', enden);

  /* ── Ablauf ── */
  startKnopf.addEventListener('click', function () {
    startKnopf.hidden = true;
    BUHU.suchen(function () {
      nebel.aufbauen();
      document.getElementById('aufgabe').hidden = false;
      BUHU.sagen('Sicht fast null');
    });
  });

  function nachrichtZeigen() {
    nachrichtEl.hidden = false;
    document.getElementById('aufgabe').hidden = true;
    BUHU.nachricht(NACHRICHT, function () {
      BUHU.bildZeigen('szene', function () {
        helfenKnopf.hidden = false;
      });
    });
  }

  helfenKnopf.addEventListener('click', function () {
    helfenKnopf.hidden = true;
    BUHU.rissSchliessen();
  });

})();
</script>
<script>
/* Macht die Tour offline lauffaehig. Siehe sw.js */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
</script>
</body>
</html>
